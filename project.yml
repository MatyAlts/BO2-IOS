name: RuntimeProbe
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  ProbePackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RuntimeProbe:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ProbePackage
        product: ProbeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maty.bo2runtimeprobe.control
        PRODUCT_NAME: RuntimeProbe
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Runtime Probe Control
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ProbeCoreTests]
    dependencies:
      - package: ProbePackage
        product: ProbeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maty.bo2runtimeprobe.tests
        GENERATE_INFOPLIST_FILE: YES
  LaunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/LaunchUITests]
    dependencies:
      - target: RuntimeProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maty.bo2runtimeprobe.launchtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RuntimeProbe
schemes:
  RuntimeProbe:
    build:
      targets:
        RuntimeProbe: all
    test:
      targets: [ProbeTests, LaunchUITests]
