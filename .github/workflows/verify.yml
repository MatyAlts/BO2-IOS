name: Verify runtime probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate pinned AOT code and image snapshot
        run: python3 Tools/AOT/prepare.py
      - name: Swift package tests
        run: |
          set -o pipefail
          mkdir -p build
          swift test | tee build/package-tests.log
      - name: Release AOT acceptance
        run: |
          set -o pipefail
          swift test -c release --filter AOTCoreTests | tee build/release-aot-tests.log
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          mkdir -p build
          xcodebuild -version | tee build/xcode-version.txt
      - name: XCTest on iOS Simulator
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project RuntimeProbe.xcodeproj -scheme RuntimeProbe -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath build/SimulatorTests.xcresult CODE_SIGNING_ALLOWED=NO test | tee build/simulator.log
      - name: Archive unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project RuntimeProbe.xcodeproj -scheme RuntimeProbe -destination 'generic/platform=iOS' -archivePath build/RuntimeProbe.xcarchive -derivedDataPath DerivedDataDevice CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' archive | tee build/archive.log
      - name: Inspect and package unsigned IPA
        run: |
          APP=build/RuntimeProbe.xcarchive/Products/Applications/RuntimeProbe.app
          xcrun otool -l "$APP/RuntimeProbe" > build/device-load-commands.txt
          xcrun otool -L "$APP/RuntimeProbe" > build/device-dependencies.txt
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" > build/device-info.txt
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qr ../RuntimeProbe-Control-0.3.0-unsigned.ipa Payload)
          IPA_PATH=build/RuntimeProbe-Control-0.3.0-unsigned.ipa python3 -m unittest discover -s Tests/ArtifactTests -v
          cp Generated/AOTCore/Resources/ImageMetadata.json build/aot-image-metadata.json
          printf '%s\n' 'AOT Runtime Control 0.3.0 (3), standard arm64 memory layout. Unsigned; requires sideload signing. Manual finite signed AOT initialization from a hash-pinned official guest image through its first logging import. Snapshot prepared at build time. Gameplay, rendering and JIT are unproven.' > build/ARTIFACT-README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RuntimeProbe-Control-0.3.0-unsigned-and-verification
          path: |
            build/RuntimeProbe-Control-0.3.0-unsigned.ipa
            build/ARTIFACT-README.txt
            build/device-load-commands.txt
            build/device-dependencies.txt
            build/device-info.txt
            build/xcode-version.txt
            build/simulator.log
            build/archive.log
            build/package-tests.log
            build/release-aot-tests.log
            build/aot-image-metadata.json
          if-no-files-found: warn
